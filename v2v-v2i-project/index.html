<!DOCTYPE html>
<!-- Syntrix V2X — index.html | Auto-redirect to login -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Syntrix V2X — Redirecting...</title>
<meta http-equiv="refresh" content="0;url=/login">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;
    background:#0d1518;
    font-family:'Inter',system-ui,sans-serif;
    color:rgba(219,228,232,0.6);
    flex-direction:column;gap:16px;
  }
  .logo{
    width:40px;height:40px;border-radius:10px;
    background:linear-gradient(135deg,#00e383,#00a855);
    display:flex;align-items:center;justify-content:center;
    font-size:1.2rem;
    box-shadow:0 0 24px rgba(0,227,131,0.35);
    margin-bottom:4px;
  }
  .name{
    font-family:monospace;font-size:1rem;font-weight:600;
    color:#00e383;letter-spacing:1px;
  }
  .spinner{
    width:28px;height:28px;
    border:2px solid rgba(0,227,131,.15);
    border-top-color:#00e383;
    border-radius:50%;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  p{font-size:.75rem;letter-spacing:.05em}
  a{color:#00e0ff;text-decoration:none}
  a:hover{text-decoration:underline}
</style>
</head>
<body>
  <div class="logo">⊞</div>
  <div class="name">Syntrix</div>
  <div class="spinner"></div>
  <p>Redirecting to <a href="/login">Secure Login</a>...</p>
  <script>
    // Instant JS redirect as backup
    window.location.replace('/login');
  </script>
</body>
</html>
